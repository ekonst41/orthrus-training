# Decoding-cycle experiment: does a third pass that verifies the rejected tail of the draft block
# raise TPF? Run: python -m orthrus.decode_exp (jobs/decode-4b.yaml); analysis:
# python -m orthrus.decode_report --config configs/decode/qwen3-4b.yaml
# Official Orthrus-Qwen3-4B checkpoint (paper), greedy, batch 1, fp32: every strategy then
# reproduces plain AR decoding exactly and can be replayed offline from the draft tables.
run_name: decode-tail-v1-qwen3-4b

model:
  base: chiennv/Orthrus-Qwen3-4B
  revision: cd93cb32557a236f2f47f9ce3cc4c18303af3843  # pinned Hub commit
  block_size: 32

data:
  dataset: nemotron-v2-qwen3-0.6b  # held-out chat prompts of the prompt set (--build-prompts)

decode:
  prompt_set: decode-v1
  prompt_set_sha256: 16f6056cf3233022921cf40cc81862b84293b6a586c196764b0c9619f28785e0
  suites: [gsm8k, math500, humaneval, mbpp, chat]
  prompts_per_suite: 64     # ranks alternate dev/test: policies are chosen on dev
  max_new_tokens: 1024
  dtype: float32
  ar_reference_prompts: 16  # per suite: plain AR too (losslessness, AR time)
  strategies:
    - {name: base}                                           # paper: draft -> verify
    - {name: tail-s0, kind: tail, shifts: [0]}               # + verify the rest of the block
    - {name: tail-tree, kind: tail, shifts: [1, 0, -1, -2]}  # + the same with shifted copies
    - {name: tail-tree-gated, kind: tail, shifts: [1, 0, -1, -2], min_expected: 4}
    - {name: reuse-tree, kind: reuse, shifts: [1, 0, -1, -2]}  # tail tried in the next verify
