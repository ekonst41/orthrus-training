# End-to-end check of the whole pipeline on a GPU in ~20 minutes: datagen -> train -> evaluate.
# Same model and per-sequence work as the paper recipe (K=32, 256 blocks, 2048 tokens), tiny data,
# so the logged seconds per step and memory also calibrate the full run.
run_name: smoke-qwen3-0.6b

model:
  base: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca  # pinned: data and teacher agree
  block_size: 32

data:
  dataset: smoke-qwen3-0.6b
  seq_len: 2048
  eval_rows: 16

train:
  epochs: 2
  global_batch_size: 16
  micro_batch_size: 4
  num_anchor_blocks: 256
  log_every: 1
  eval_every: 10
  save_every: 5

eval:
  prompts: 8
  max_new_tokens: 256
  check_ar_parity: true

datagen:
  source_revision: 5c89e01dd720ae0f4058445ed49c5fb68a03c76e  # Nemotron v2 commit
  samples_per_domain: 200
  eval_prompts_per_domain: 8
  max_new_tokens: 512
  shard_size: 300
