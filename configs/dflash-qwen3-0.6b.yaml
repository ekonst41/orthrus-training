# bash scripts/train.sh configs/dflash-qwen3-0.6b.yaml
run_name: qwen3-0.6b-dflash-kl
# Local: data/<dataset>/ and outputs/<run_name>/.
data_dir: data
output_dir: outputs

model:
  kind: dflash
  draft_layers: 5
  trainable_dtype: float32
  base: Qwen/Qwen3-0.6B
  revision: c1899de289a04d12100db370d81485cdf75e47ca
  block_size: 32

data:
  dataset: nemotron-v2-qwen3-0.6b
  seq_len: 2048
  eval_rows: 256

train:
  loss_type: kl              # set ce and use a new run_name for cross-entropy
  kl_chunk_size: 512         # vocabulary projection chunk size for either loss
  activation_checkpointing: true
  epochs: 2
  global_batch_size: 128     # GPUs * micro_batch_size * accumulation
  micro_batch_size: 4       # per GPU
  learning_rate: 2.0e-4
  num_anchor_blocks: 256
  loss_gamma: 8            # 0: uniform, e.g. 8: exp(-position/8)
  compile: true
  eval_every: 500
  save_every: 100
  keep_checkpoints: 2       # local; remote checkpoints are retained

eval:
  suites: [heldout, gsm8k, math500, humaneval, mbpp]
  prompts: 32
  max_new_tokens: 512
  dtype: float32            # separate bf16 runs measure bf16 speed

hf:
  bucket: null              # ORTHRUS_BUCKET from .env; "" means local-only
  upload: true
