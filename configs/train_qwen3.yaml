model:
  model_dir: Qwen/Qwen3-0.6B
  block_size: 32
  mask_token_id: null
  attn_implementation: sdpa

data:
  packed_cache_path: data/qwen3-06-packed-2048
  allow_missing_assistant_mask: false
  num_workers: 2

training:
  seq_len: 2048
  micro_batch_size: 4
  grad_accum_steps: 16
  epochs: 2
  max_steps: 0
  num_anchor_blocks: 256
  lr: 0.0002
  warmup_ratio: 0.05
  weight_decay: 0.0
  max_grad_norm: 1.0
  dtype: bfloat16
  seed: 42
  activation_checkpointing: false

loss:
  kl_chunk_size: 32
  temperature: 1.0

distributed:
  flex_backend: triton
  fsdp2: false
  dist_timeout_minutes: 180

checkpoint:
  output_dir: checkpoints/orthrus-qwen3-0.6b
  resume_from: null
  auto_resume: false
  keep_last_checkpoints: 0
  save_every: 100

logging:
  log_every: 10
  wandb: false
  wandb_project: orthrus-qwen3
  wandb_run_name: null

preparation:
  source: nvidia/Nemotron-Post-Training-Dataset-v2
  domains: [math, code, chat]
  batch_size: 32
  n_per_domain: 100
  max_new_tokens: 2048
  enable_thinking: false
  shuffle_buffer_size: 1000
  train_jsonl: data/train_qwen3_0.6.jsonl
  packed_jsonl: data/qwen3_packed_rows_0.6.jsonl
