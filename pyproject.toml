# Tool settings only. Dependencies live in requirements/*.in (locks: requirements/*.txt).

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::UserWarning:torch.*", "ignore::DeprecationWarning:torch.*"]
