# GPU stack probe: torch/CUDA, bf16 GEMM, compiled FlexAttention (Orthrus mask), HF Hub download.
# Run from the repo root: python scripts/ds.py run jobs/probe-gpu.yaml --max-minutes 60
name: orthrus-probe-gpu
desc: Torch/CUDA stack, GEMM, compiled FlexAttention, HF Hub download speed
# `timeout` is a hard stop inside the job; --max-minutes in ds.py also cancels it from outside.
cmd: timeout 50m python3 scripts/probe_gpu.py ${REPORT}
env:
  vars:
    - PYTHONUNBUFFERED: 1
  python:
    type: manual
    version: 3.12
    requirements-file: requirements/train.txt
    local-paths:
      - scripts/probe_gpu.py
outputs:
  - outputs/probe_gpu.json: REPORT
cloud-instance-types:
  - g2.1
