# Speed evaluation of the exported model: TPF, acceptance length, AR parity, wall-clock speedup.
# python scripts/ds.py run jobs/eval.yaml --max-minutes 240
name: orthrus-eval
desc: Orthrus speed evaluation on held-out prompts and benchmarks (results to the HF bucket)
cmd: >-
  timeout --kill-after=10m 4h python3 -m orthrus.evaluate --config configs/qwen3-0.6b.yaml
  eval.prompts=100 eval.max_new_tokens=1024
inputs:
  - configs/qwen3-0.6b.yaml
  - requirements/train.txt
env:
  vars:
    - HF_HUB_DISABLE_PROGRESS_BARS: 1
    - TOKENIZERS_PARALLELISM: "false"
    - PYTHONUNBUFFERED: 1
    - ORTHRUS_BUCKET
    - ORTHRUS_TRACKIO_SPACE
    - ORTHRUS_GIT_COMMIT
  python:
    type: manual
    version: 3.12
    requirements-file: requirements/train.txt
    local-paths:
      - orthrus
cloud-instance-types:
  - g2.1
