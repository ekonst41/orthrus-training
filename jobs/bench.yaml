# Training-step benchmark: speed, memory and gradient agreement of the training-path variants,
# FlexAttention kernel settings and micro-batch size, on the smoke data (~25 min).
# python scripts/ds.py run jobs/bench.yaml --max-minutes 55
name: orthrus-bench
desc: Training-step speed benchmark (results to bench/ in the HF bucket)
cmd: timeout --kill-after=2m 50m python3 -m orthrus.bench --config configs/smoke.yaml
inputs:
  - configs/smoke.yaml
  - requirements/train.txt
env:
  vars:
    - HF_HUB_DISABLE_PROGRESS_BARS: 1
    - TOKENIZERS_PARALLELISM: "false"
    - PYTHONUNBUFFERED: 1
    - PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    - ORTHRUS_BUCKET
    - ORTHRUS_TRACKIO_SPACE
    - ORTHRUS_GIT_COMMIT
  python:
    type: manual
    version: 3.12
    requirements-file: requirements/train.txt
    local-paths:
      - orthrus
cloud-instance-types:
  - g2.1
